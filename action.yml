name: "Dokploy Deployment"
description: "Trigger a Dokploy deployment"
branding:
  icon: 'upload-cloud'
  color: 'gray-dark'

inputs:
  dokploy_url:
    description: "Dokploy base URL, e.g. https://dokploy.example.com"
    required: true
  api_token:
    description: 'Dokploy authentication token'
    required: true
  application_id:
    description: "Dokploy application/compose ID"
    required: true
  service_type:
    description: "Type of Dokploy service (compose or application)"
    required: false
    default: "application"
  title:
    description: "Title of the deploy, to be shown in dokploy deployments"
    required: false
    default: "Deploy via github action"
  description:
    description: "Description of the deploy, to be shown in dokploy deployments"
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate deployment type
      shell: bash
      run: |
        case "${{ inputs.service_type }}" in
          application|compose)
            echo "Valid service type: ${{ inputs.service_type }}"
            ;;
          *)
            echo "Invalid service type: ${{ inputs.service_type }}"
            exit 1
            ;;
        esac

    - name: Trigger Dokploy deployment
      shell: bash
      env:
        DOKPLOY_URL: ${{ inputs.dokploy_url }}
        DOKPLOY_API_TOKEN: ${{ inputs.api_token }}
        DOKPLOY_APPLICATION_ID: ${{ inputs.application_id }}
        DOKPLOY_TITLE: ${{ inputs.title }}
        DOKPLOY_DESCRIPTION: ${{ inputs.description }}
      run: |
        if [ -n "$DOKPLOY_DESCRIPTION" ]; then
          BODY= "{\"${{ inputs.service_type }}Id\": \"$DOKPLOY_APPLICATION_ID\" , \"title\": \"$DOKPLOY_TITLE\" }"
        else
          BODY= "{\"${{ inputs.service_type }}Id\": \"$DOKPLOY_APPLICATION_ID\" , \"title\": \"$DOKPLOY_TITLE\" , \"description\": \"$DOKPLOY_DESCRIPTION\" }"
        fi

        response=$(curl -X POST \
          "$DOKPLOY_URL/api/${{ inputs.service_type }}.deploy" \
          -H 'accept: application/json' \
          -H "x-api-key:${DOKPLOY_API_TOKEN}" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $DOKPLOY_AUTH_TOKEN" \
          -d "$BODY" \
          -w "%{http_code}" \
          -o /dev/null \
          -s)

        if [ "$response" -ne 200 ]; then
          echo "Deployment failed with status code: $response"
          exit 1
        else
          echo "Deployment triggered successfully with status code: $response"
        fi
